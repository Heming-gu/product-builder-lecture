<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --focus-ring: rgba(79, 70, 229, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
        }

        .form-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-color);
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }

        .comments-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .comments-container h3 {
            margin-top: 0;
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <div class="header">
            <h2>제휴 및 협업 문의</h2>
            <p class="subtitle">궁금하신 점이나 제휴 제안을 남겨주시면 빠르게 검토 후 회신 드리겠습니다.</p>
        </div>

        <form action="https://formspree.io/f/xoevkovn" method="POST">
            <div class="form-group">
                <label for="name">담당자명 / 회사명</label>
                <input type="text" id="name" name="name" required placeholder="예: 홍길동 / (주)회사명">
            </div>
            
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="_replyto" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label for="phone">연락처 (선택)</label>
                <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
            </div>
            
            <div class="form-group">
                <label for="subject">문의 제목</label>
                <input type="text" id="subject" name="subject" required placeholder="제휴 제안 건">
            </div>
            
            <div class="form-group">
                <label for="message">문의 내용</label>
                <textarea id="message" name="message" required placeholder="제휴 내용, 제안 배경, 예상 일정 등을 자유롭게 적어주세요."></textarea>
            </div>
            
            <!-- Formspree hidden configuration -->
            <input type="hidden" name="_subject" value="[제휴문의] 새로운 제휴 제안이 접수되었습니다!">
            
            <button type="submit">문의하기</button>
        </form>

        <div class="footer-note">
            Powered by Formspree
        </div>
    </div>

    <!-- Disqus Comments Section -->
    <div class="comments-container">
        <h3>댓글 및 피드백</h3>
        <div id="disqus_thread"></div>
        <script>
            /**
            *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
            *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
            var disqus_config = function () {
                this.page.url = window.location.href;  // Replace PAGE_URL with your page's unique URL variable
                this.page.identifier = window.location.pathname; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
            };
            (function() { // DON'T EDIT BELOW THIS LINE
            var d = document.getElementById('disqus_thread'), s = d.appendChild(document.createElement('script'));
            s.src = 'https://productbuilder-mogwa6sb38.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            })();
        </script>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_scriptNOHSCRIPT">comments powered by Disqus.</a></noscript>
    </div>
</div>

</body>
</html>
